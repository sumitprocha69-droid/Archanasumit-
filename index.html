<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archana-Sumit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:Arial;color:#111}
.app{max-width:500px;margin:auto;background:white;min-height:100vh}
header{height:58px;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd;position:sticky;top:0;background:white;z-index:5}
.logo{font-size:22px;font-weight:bold}
button{border:0;background:none;font-size:25px;cursor:pointer}
.storybar{display:flex;gap:14px;padding:12px;overflow:hidden;border-bottom:1px solid #eee}
.story{text-align:center;font-size:12px;min-width:62px}.circle{width:55px;height:55px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#f00,#f0c,#ff0)}
.circle img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid white}
.post{border-bottom:1px solid #ddd}.posthead{display:flex;align-items:center;padding:10px}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover}.user{margin-left:9px;font-weight:bold}.photo{width:100%;height:420px;object-fit:cover;display:block}
.actions{display:flex;gap:18px;padding:9px 12px}.actions button{font-size:25px}.save{margin-left:auto}
.info{padding:0 12px 12px}.liked{color:#e11}.comments{display:none;padding:0 12px 12px}.comments input{width:80%;padding:9px;border:1px solid #ccc;border-radius:18px}.comments button{font-size:16px;background:#111;color:white;border-radius:15px;padding:7px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:500px;width:100%;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px}
.panel{display:none;padding:25px;text-align:center;min-height:300px}
</style>
</head>

<body>
<div class="app">

<header>
<div class="logo">Archana-Sumit</div>
<button onclick="openMsg()">💬</button>
</header>

<div class="storybar">
<div class="story"><div class="circle"><img src="https://i.pravatar.cc/100?img=47"></div>Archana</div>
<div class="story"><div class="circle"><img src="https://i.pravatar.cc/100?img=12"></div>Sumit</div>
<div class="story"><div class="circle"><img src="https://i.pravatar.cc/100?img=32"></div>Friends</div>
</div>

<main id="home">

<div class="post">
<div class="posthead">
<img class="avatar" src="https://i.pravatar.cc/100?img=47">
<span class="user">Archana</span>
</div>

<img class="photo" src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=800">

<div class="actions">
<button onclick="like(this)">♡</button>
<button onclick="comment(this)">💬</button>
<button onclick="openMsg()">➤</button>
<button class="save" onclick="save(this)">🔖</button>
</div>

<div class="info"><b>❤️ <span>24</span> likes</b><br>
<strong>Archana</strong> Beautiful day ✨</div>

<div class="comments">
<div id="list"></div>
<input placeholder="Comment likhiye..." />
<button onclick="addComment(this)">Post</button>
</div>
</div>

</main>

<div id="message" class="panel">
<h2>💬 Messages</h2>
<p>Yahan messages aayenge.</p>
<button onclick="home()">← Home</button>
</div>

<div id="account" class="panel">
<img class="avatar" src="https://i.pravatar.cc/100?img=47">
<h2>Archana-Sumit</h2>
<p>✨ Welcome to your profile</p>
<button onclick="home()">← Home</button>
</div>

<nav>
<button onclick="home()">🏠</button>
<button onclick="openMsg()">💬</button>
<button onclick="account()">👤</button>
</nav>

</div>

<script>
function like(b){
 b.classList.toggle("liked");
 b.textContent=b.classList.contains("liked")?"♥":"♡";
 let n=b.parentElement.nextElementSibling.querySelector("span");
 n.textContent=+n.textContent+(b.classList.contains("liked")?1:-1);
}
function comment(b){
 let c=b.closest(".post").querySelector(".comments");
 c.style.display=c.style.display=="block"?"none":"block";
}
function addComment(b){
 let i=b.previousElementSibling;
 if(i.value.trim()){
  b.parentElement.querySelector("#list").innerHTML+=
  "<p>👤 <b>Sumit</b> "+i.value+"</p>";
  i.value="";
 }
}
function save(b){b.textContent=b.textContent=="🔖"?"✅":"🔖"}
function hide(){
 document.getElementById("home").style.display="none";
 document.getElementById("message").style.display="none";
 document.getElementById("account").style.display="none";
}
function home(){hide();document.getElementById("home").style.display="block"}
function openMsg(){hide();document.getElementById("message").style.display="block"}
function account(){hide();document.getElementById("account").style.display="block"}
</script>
</body>
</html>
