
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Archana-Sumit</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#fafafa;font-family:Arial,sans-serif;color:#111}
header{
 position:sticky;top:0;z-index:10;background:white;
 border-bottom:1px solid #ddd;padding:12px 15px;
 display:flex;justify-content:space-between;align-items:center
}
.logo{font-size:24px;font-weight:bold}
nav{display:flex;gap:18px;font-size:24px}
main{max-width:600px;margin:auto;padding-bottom:70px}
.post{background:white;border-bottom:1px solid #ddd;margin-bottom:12px}
.head{display:flex;align-items:center;padding:12px}
.avatar{
 width:40px;height:40px;border-radius:50%;
 background:linear-gradient(45deg,#ff7a00,#ff006a,#833ab4);
 display:grid;place-items:center;color:white;font-weight:bold
}
.username{font-weight:bold;margin-left:10px}
.more{margin-left:auto;font-size:22px}
.media{
 width:100%;height:430px;background:#eee;
 display:flex;align-items:center;justify-content:center;
 overflow:hidden
}
.media img,.media video{width:100%;height:100%;object-fit:cover}
.placeholder{font-size:70px}
.actions{display:flex;gap:18px;padding:12px 14px;font-size:27px}
.actions span{cursor:pointer}
.save{margin-left:auto}
.likes,.caption,.comments{padding:0 14px 8px}
.caption b{margin-right:5px}
.comments{color:#666;cursor:pointer}
.bottom{
 position:fixed;bottom:0;left:0;right:0;background:white;
 border-top:1px solid #ddd;display:flex;justify-content:space-around;
 padding:12px;font-size:24px
}
button{
 border:0;background:#111;color:white;border-radius:10px;
 padding:10px 15px;margin:10px;cursor:pointer
}
#upload{display:none}
.modal{
 display:none;position:fixed;inset:0;background:#0008;
 z-index:30;align-items:flex-end
}
.box{
 background:white;width:100%;max-width:600px;margin:auto;
 padding:20px;border-radius:20px 20px 0 0
}
textarea{width:100%;height:80px;padding:10px;border:1px solid #ccc;border-radius:10px}
</style>
</head>

<body>

<header>
<div class="logo">Archana-Sumit</div>
<nav>
<span onclick="home()">⌂</span>
<span onclick="document.getElementById('upload').click()">＋</span>
<span onclick="alert('Messages opened 💬')">♡</span>
</nav>
</header>

<main id="feed">

<!-- POST 1 -->
<div class="post">
<div class="head">
<div class="avatar">A</div>
<div class="username">Archana</div>
<div class="more">•••</div>
</div>

<div class="media">
<div class="placeholder">🌸❤️</div>
</div>

<div class="actions">
<span onclick="like(this)">♡</span>
<span onclick="comment()">💬</span>
<span onclick="share()">➤</span>
<span class="save" onclick="save(this)">♡</span>
</div>

<div class="likes">❤️ <span class="count">12</span> likes</div>
<div class="caption"><b>Archana</b> ❤️ Archana-Sumit</div>
<div class="comments" onclick="comment()">View all comments</div>
</div>


<!-- POST 2 -->
<div class="post">
<div class="head">
<div class="avatar">S</div>
<div class="username">Sumit</div>
<div class="more">•••</div>
</div>

<div class="media">
<div class="placeholder">📸✨</div>
</div>

<div class="actions">
<span onclick="like(this)">♡</span>
<span onclick="comment()">💬</span>
<span onclick="share()">➤</span>
<span class="save" onclick="save(this)">♡</span>
</div>

<div class="likes">❤️ <span class="count">8</span> likes</div>
<div class="caption"><b>Sumit</b> Our beautiful memories ❤️</div>
<div class="comments" onclick="comment()">View all comments</div>
</div>

</main>

<div style="text-align:center">
<label for="upload"><button>＋ Add Photo / Video</button></label>
<input id="upload" type="file" accept="image/*,video/*" onchange="addPost(event)">
</div>

<div class="bottom">
<span onclick="home()">⌂</span>
<span onclick="alert('Search 🔍')">⌕</span>
<span onclick="document.getElementById('upload').click()">＋</span>
<span onclick="alert('Messages 💬')">♡</span>
<span onclick="alert('Profile 👤')">◯</span>
</div>

<div class="modal" id="modal">
<div class="box">
<h3>Comments</h3>
<textarea id="commentText" placeholder="Comment likho..."></textarea>
<br>
<button onclick="addComment()">Post</button>
<button onclick="closeComment()">Close</button>
<div id="commentList"></div>
</div>
</div>

<script>

function like(el){
 let post=el.closest(".post");
 let count=post.querySelector(".count");
 let n=parseInt(count.innerText);

 if(el.dataset.liked==="yes"){
   el.innerText="♡";
   count.innerText=n-1;
   el.dataset.liked="no";
 }else{
   el.innerText="♥";
   count.innerText=n+1;
   el.dataset.liked="yes";
 }
}

function save(el){
 if(el.dataset.saved==="yes"){
   el.innerText="♡";
   el.dataset.saved="no";
   alert("Removed from saved");
 }else{
   el.innerText="🔖";
   el.dataset.saved="yes";
   alert("Post saved ❤️");
 }
}

function share(){
 if(navigator.share){
   navigator.share({
     title:"Archana-Sumit",
     text:"Check this post ❤️",
     url:location.href
   });
 }else{
   navigator.clipboard.writeText(location.href);
   alert("Link copied ❤️");
 }
}

function comment(){
 document.getElementById("modal").style.display="flex";
}

function closeComment(){
 document.getElementById("modal").style.display="none";
}

function addComment(){
 let text=document.getElementById("commentText").value.trim();
 if(!text)return;

 let d=document.createElement("div");
 d.innerHTML="<b>You:</b> "+text;
 d.style.padding="8px 0";
 document.getElementById("commentList").appendChild(d);

 document.getElementById("commentText").value="";
}

function addPost(e){
 let file=e.target.files[0];
 if(!file)return;

 let url=URL.createObjectURL(file);
 let isVideo=file.type.startsWith("video");

 let post=document.createElement("div");
 post.className="post";

 post.innerHTML=`
 <div class="head">
   <div class="avatar">S</div>
   <div class="username">Sumit</div>
   <div class="more">•••</div>
 </div>

 <div class="media">
   ${isVideo
   ? `<video src="${url}" controls playsinline></video>`
   : `<img src="${url}">`}
 </div>

 <div class="actions">
   <span onclick="like(this)">♡</span>
   <span onclick="comment()">💬</span>
   <span onclick="share()">➤</span>
   <span class="save" onclick="save(this)">♡</span>
 </div>

 <div class="likes">❤️ <span class="count">0</span> likes</div>
 <div class="caption"><b>Sumit</b> New memory ❤️</div>
 <div class="comments" onclick="comment()">View all comments</div>
 `;

 document.getElementById("feed").prepend(post);
 e.target.value="";
 window.scrollTo({top:0,behavior:"smooth"});
}

function home(){
 window.scrollTo({top:0,behavior:"smooth"});
}

</script>

</body>
</html>
