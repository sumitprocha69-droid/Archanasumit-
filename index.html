<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archana-Sumit</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#000;
  color:#fff;
  padding-bottom:65px;
}
.header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #262626;
  position:sticky;
  top:0;
  background:#000;
  z-index:10;
}
.logo{
  font-size:25px;
  font-weight:bold;
  font-style:italic;
}
.icons{font-size:24px;display:flex;gap:20px}

.stories{
  display:flex;
  gap:15px;
  padding:14px;
  overflow-x:auto;
  border-bottom:1px solid #262626;
}
.story{text-align:center;min-width:70px;font-size:12px}
.story img{
  width:62px;height:62px;border-radius:50%;
  object-fit:cover;
  padding:2px;
  border:3px solid #e1306c;
}
.story p{margin-top:5px}

.post{border-bottom:1px solid #262626;margin-bottom:10px}
.posthead{
  height:55px;
  display:flex;
  align-items:center;
  padding:8px 12px;
  gap:10px;
}
.avatar{
  width:38px;height:38px;border-radius:50%;
  object-fit:cover;
}
.username{font-weight:bold;flex:1}
.more{font-size:22px}

.postimage{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}

.actions{
  display:flex;
  gap:18px;
  padding:12px;
  font-size:27px;
}
.actions span{cursor:pointer}
.save{margin-left:auto}
.likes{padding:0 12px;font-weight:bold}
.caption{padding:8px 12px 15px}
.caption b{margin-right:6px}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:60px;
  background:#000;
  border-top:1px solid #262626;
  display:flex;
  justify-content:space-around;
  align-items:center;
  font-size:25px;
  z-index:20;
}
.nav span{cursor:pointer}

.searchbox{
  display:none;
  padding:12px;
  background:#111;
}
.searchbox input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:0;
  background:#222;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Archana-Sumit</div>
  <div class="icons">
    <span onclick="toggleSearch()">⌕</span>
    <span>♡</span>
    <span>✈</span>
  </div>
</header>

<div class="searchbox" id="search">
  <input type="text" placeholder="Search">
</div>

<section class="stories">

  <div class="story">
    <img src="https://i.pravatar.cc/150?img=12">
    <p>Your story</p>
  </div>

  <div class="story">
    <img src="https://i.pravatar.cc/150?img=32">
    <p>Archana</p>
  </div>

  <div class="story">
    <img src="https://i.pravatar.cc/150?img=44">
    <p>Friends</p>
  </div>

  <div class="story">
    <img src="https://i.pravatar.cc/150?img=25">
    <p>Travel</p>
  </div>

  <div class="story">
    <img src="https://i.pravatar.cc/150?img=5">
    <p>Family</p>
  </div>

</section>

<main>

<!-- POST 1 -->
<article class="post">

  <div class="posthead">
    <img class="avatar" src="https://i.pravatar.cc/150?img=12">
    <span class="username">archana_sumit</span>
    <span class="more">•••</span>
  </div>

  <img class="postimage"
       src="https://picsum.photos/id/1011/800/800">

  <div class="actions">
    <span onclick="like(this)">♡</span>
    <span>💬</span>
    <span>➤</span>
    <span class="save">♡</span>
  </div>

  <div class="likes">1,245 likes</div>

  <div class="caption">
    <b>archana_sumit</b>
    Beautiful day ❤️✨
  </div>

</article>


<!-- POST 2 -->
<article class="post">

  <div class="posthead">
    <img class="avatar" src="https://i.pravatar.cc/150?img=32">
    <span class="username">sumit_official</span>
    <span class="more">•••</span>
  </div>

  <img class="postimage"
       src="https://picsum.photos/id/1015/800/800">

  <div class="actions">
    <span onclick="like(this)">♡</span>
    <span>💬</span>
    <span>➤</span>
    <span class="save">♡</span>
  </div>

  <div class="likes">856 likes</div>

  <div class="caption">
    <b>sumit_official</b>
    Enjoying the moment 😎
  </div>

</article>

</main>

<nav class="nav">
  <span>⌂</span>
  <span onclick="toggleSearch()">⌕</span>
  <span>＋</span>
  <span>♡</span>
  <span>◉</span>
</nav>

<script>
function like(el){
  if(el.innerHTML==="♡"){
    el.innerHTML="♥";
    el.style.color="red";
  }else{
    el.innerHTML="♡";
    el.style.color="white";
  }
}

function toggleSearch(){
  let box=document.getElementById("search");
  box.style.display =
    box.style.display==="block" ? "none" : "block";
}
</script>

</body>
</html>
