
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Archana-Sumit</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#fff;color:#111;
  max-width:700px;margin:auto;
}
.top{
  height:70px;display:flex;align-items:center;
  justify-content:space-between;padding:0 18px;
  position:sticky;top:0;background:#fff;z-index:5;
}
.logo{font-size:30px;font-weight:700}
.icon{font-size:38px;font-weight:300;cursor:pointer}

.stories{
  display:flex;gap:15px;overflow-x:auto;
  padding:10px 12px 14px;
  scrollbar-width:none;
}
.stories::-webkit-scrollbar{display:none}
.story{min-width:78px;text-align:center;font-size:13px}
.circle{
  width:76px;height:76px;border-radius:50%;
  padding:3px;
  background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
}
.circle img{
  width:100%;height:100%;border-radius:50%;
  object-fit:cover;border:3px solid white;
}
.storyname{
  margin-top:6px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}

.post{margin-top:4px}
.posthead{
  display:flex;align-items:center;
  padding:8px 12px;
}
.avatar{
  width:42px;height:42px;border-radius:50%;
  padding:2px;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
}
.avatar img{
  width:100%;height:100%;border-radius:50%;
  object-fit:cover;border:2px solid white;
}
.user{
  margin-left:9px;font-weight:bold;font-size:16px;
}
.music{
  font-size:13px;font-weight:normal;
  margin-top:5px;color:#555;
}
.more{margin-left:auto;font-size:26px}

.photo{
  width:100%;height:520px;
  object-fit:cover;display:block;
  background:#ddd;
}

.actions{
  display:flex;align-items:center;
  padding:10px 14px;gap:20px;
  font-size:29px;
}
.actions span{cursor:pointer}
.save{margin-left:auto}

.likes{
  padding:0 14px;font-weight:bold;
}
.caption{padding:6px 14px 14px}
.caption b{margin-right:5px}

.bottom{
  height:70px;background:#fff;
  border-top:1px solid #ddd;
  position:fixed;bottom:0;
  left:50%;transform:translateX(-50%);
  width:100%;max-width:700px;
  display:flex;justify-content:space-around;
  align-items:center;z-index:10;
}
.bottom button{
  border:0;background:none;
  font-size:27px;cursor:pointer;
}
.bottom img{
  width:34px;height:34px;border-radius:50%;
  object-fit:cover;
}

.toast{
  position:fixed;bottom:85px;left:50%;
  transform:translateX(-50%);
  background:#111;color:white;
  padding:10px 18px;border-radius:20px;
  display:none;z-index:20;
}
</style>
</head>

<body>

<div class="top">
  <div class="icon" onclick="addPost()">＋</div>
  <div class="logo">Archana-Sumit</div>
  <div class="icon" onclick="showMsg()">♡</div>
</div>

<!-- STORIES -->
<div class="stories">

  <div class="story">
    <div class="circle">
      <img src="photo.jpg">
    </div>
    <div class="storyname">Your story ＋</div>
  </div>

  <div class="story">
    <div class="circle">
      <img src="photo.jpg">
    </div>
    <div class="storyname">meena_____ji</div>
  </div>

  <div class="story">
    <div class="circle">
      <img src="photo.jpg">
    </div>
    <div class="storyname">ka.ranveer2855</div>
  </div>

  <div class="story">
    <div class="circle">
      <img src="photo.jpg">
    </div>
    <div class="storyname">priyarishu88138</div>
  </div>

</div>

<!-- POST -->
<div class="post">

  <div class="posthead">
    <div class="avatar">
      <img src="photo.jpg">
    </div>

    <div class="user">
      meenakshi______ji
      <div class="music">
        🎵 Himesh Reshammiya, Alka Yagnik, Kunal Ganjawala
      </div>
    </div>

    <div class="more">⋯</div>
  </div>

  <img class="photo" src="photo.jpg">

  <div class="actions">
    <span onclick="like()">♡</span>
    <span onclick="comment()">◯</span>
    <span onclick="share()">➤</span>
    <span class="save" onclick="save()">♧</span>
  </div>

  <div class="likes" id="likes">0 likes</div>

  <div class="caption">
    <b>meenakshi______ji</b>
    Beautiful moments ❤️
  </div>

</div>

<!-- BOTTOM -->
<div class="bottom">
  <button onclick="home()">⌂</button>
  <button onclick="reels()">▶</button>
  <button onclick="messages()">➤</button>
  <button onclick="search()">⌕</button>
  <button onclick="profile()">
    <img src="photo.jpg">
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
let likes=0;

function toast(t){
  let x=document.getElementById("toast");
  x.innerText=t;
  x.style.display="block";
  setTimeout(()=>x.style.display="none",1500);
}

function like(){
  likes++;
  document.getElementById("likes").innerText=likes+" likes";
  toast("❤️ Liked");
}

function comment(){
  let c=prompt("Comment likhiye:");
  if(c) toast("Comment added 💬");
}

function share(){
  toast("Post share kiya gaya ➤");
}

function save(){
  toast("Post saved 🔖");
}

function addPost(){
  toast("＋ New post");
}

function showMsg(){
  toast("Notifications ❤️");
}

function home(){
  window.scrollTo({top:0,behavior:"smooth"});
}

function reels(){
  toast("Reels ▶");
}

function messages(){
  toast("Messages 💬");
}

function search(){
  let q=prompt("Search kijiye:");
  if(q) toast("Searching: "+q);
}

function profile(){
  toast("Profile 👤");
}
</script>

</body>
</html>
